[cont3xt]
searchTimeout=5s
authMode=regressionTests
mcpEnabled=true
mcpAuthMode=regressionTests
arkimeWebURL=http://localhost:3218
mcpMaxResultBytes=2048
mcpDefaultView=mcpdefault
usersPrefix=tests
disableUserPasswordUI=false
#dbUrl=lmdb:///tmp/cont3xt-db

[Maxmind]
geoLite2ASN=../tests/GeoLite2-ASN.mmdb
geoLite2Country=../tests/GeoLite2-City.mmdb

[elasticsearch:test]
index=tests_cont3xt
itypes=ip
queryField=source.ip
url=http://localhost:9200
locked=true

[misp:test]
url=https://localhost:9998
key=misp-test-key
insecure=true
itypes=ip,domain

[csv:rir]
url=../tests/ipv4-address-space.csv
itypes=ip
keyColumn=Prefix

[csv:whois]
url=../tests/ipv4-address-space.csv
itypes=text,domain
keyColumn=WHOIS

[csv:longkey]
url=../tests/cont3xt-longkey.csv
itypes=text
keyColumn=key

[json:ipwise]
url=../tests/ip.wise.json
itypes=ip
keyPath=ip

[wise:test]

[urlapi:test]
url=https://localhost:9998/cont3xt/echo/{value}/{valueBase64}/{valueBase64Url}
itypes=text
insecure=true
keyHeader=X-API-Key
resultField=value

[urlapi:redirect]
url=https://localhost:9998/cont3xt/redirect/{value}
itypes=text
insecure=true

[urlapi:slow]
url=https://localhost:9998/cont3xt/slow/{value}
itypes=text
insecure=true
timeout=60

# verifies the mock with caTrustFile and sends a client cert. insecure=false because
# an https://localhost url skips verification unless the section says otherwise
[urlapi:mtls]
url=https://localhost:9998/cont3xt/echo/{value}/{valueBase64}/{valueBase64Url}
itypes=text
insecure=false
caTrustFile=../tests/mini-wise-source.crt
clientKey=../tests/mtls-client.key
clientCert=../tests/mtls-client.crt
resultField=value

# follows one redirect: same origin keeps the client cert and CA, 127.0.0.1 is another
# origin so that hop gets the system CAs and fails against the self-signed mock
[urlapi:redirects]
url=https://localhost:9998/cont3xt/{value}/x
itypes=text
insecure=false
maxRedirects=1
caTrustFile=../tests/mini-wise-source.crt
clientKey=../tests/mtls-client.key
clientCert=../tests/mtls-client.crt
resultField=value
