[cont3xt]
authMode=regressionTests
mcpEnabled=true
mcpAuthMode=regressionTests
arkimeWebURL=http://localhost:3218
mcpMaxResultBytes=2048
mcpDefaultView=mcpdefault
usersPrefix=tests
disableUserPasswordUI=false
#dbUrl=lmdb:///tmp/cont3xt-db

[Maxmind]
geoLite2ASN=../tests/GeoLite2-ASN.mmdb
geoLite2Country=../tests/GeoLite2-City.mmdb

[elasticsearch:test]
index=tests_sessions3-13m12
itypes=ip
queryField=source.ip
url=http://localhost:9200
locked=true

[csv:rir]
url=../tests/ipv4-address-space.csv
itypes=ip
keyColumn=Prefix

[csv:whois]
url=../tests/ipv4-address-space.csv
itypes=text,domain
keyColumn=WHOIS

[csv:longkey]
url=../tests/cont3xt-longkey.csv
itypes=text
keyColumn=key

[json:ipwise]
url=../tests/ip.wise.json
itypes=ip
keyPath=ip

[wise:test]

[urlapi:test]
url=https://localhost:9998/cont3xt/echo/{value}/{valueBase64}/{valueBase64Url}
itypes=text
insecure=true
keyHeader=X-API-Key
resultField=value

[urlapi:redirect]
url=https://localhost:9998/cont3xt/redirect/{value}
itypes=text
insecure=true
